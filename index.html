<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BARTOTEC — Seu diário musical</title>
    <meta name="description" content="Avalie músicas e álbuns, monte seu diário de escutas e sua lista de quero ouvir. Top mundial e lançamentos direto do Deezer." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css?v=8" />
  </head>
  <body>
    <header id="topo"></header>

    <main>
      <section class="container hero">
        <h1>Seu <em>diário</em> de músicas e <b>álbuns</b>.</h1>
        <p>
          Busque no acervo do Deezer, dê sua nota de 1 a 5, escreva a resenha e registre o que
          você ouviu hoje. Simples assim.
        </p>
        <form class="busca" id="form-busca" style="max-width: 620px">
          <input id="campo-busca" type="search" placeholder="Buscar por artista, música ou álbum..." />
          <select id="tipo-busca">
            <option value="track">Músicas</option>
            <option value="album">Álbuns</option>
            <option value="artist">Artistas</option>
          </select>
          <button class="btn btn-rosa" type="submit">Buscar</button>
        </form>
      </section>

      <section class="container secao">
        <div class="secao-topo">
          <h2>Top mundial agora</h2>
          <span class="info">chart geral do Deezer</span>
        </div>
        <div class="grade" id="grade-top"><p class="carregando">Carregando o top mundial...</p></div>
      </section>

      <section class="container secao">
        <div class="secao-topo">
          <h2>Lançamentos recentes</h2>
          <span class="info">novidades mundiais</span>
        </div>
        <div class="grade" id="grade-recentes"><p class="carregando">Carregando lançamentos...</p></div>
      </section>
    </main>

    <footer id="rodape"></footer>

    <script src="js/api.js?v=8"></script>
    <script src="js/comum.js?v=8"></script>
    <script src="js/inicio.js?v=8"></script>
  </body>
</html>
